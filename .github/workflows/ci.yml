name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BACKEND_API: ${{ secrets.BACKEND_API }}
      BACKEND_KEY: ${{ secrets.BACKEND_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npx astro check
      - run: npm run build
